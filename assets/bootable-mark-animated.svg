<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame 1.8s ease-in-out infinite; }
    .core { transform-box: fill-box; transform-origin: 50% 100%; animation: core 1.25s ease-in-out infinite alternate; }
    .glow { animation: glow 1.8s ease-in-out infinite; }
    .ember { animation: ember 1.8s ease-out infinite; }
    @keyframes flame { 0%,100% { transform: scale(1) rotate(-1deg); } 45% { transform: scale(.94,1.06) rotate(1.5deg); } 72% { transform: scale(1.03,.97) rotate(-.5deg); } }
    @keyframes core { from { opacity: .72; transform: scale(.88,1); } to { opacity: 1; transform: scale(1.04,1.08); } }
    @keyframes glow { 0%,100% { opacity: .22; } 50% { opacity: .5; } }
    @keyframes ember { 0% { opacity: 0; transform: translate(0,5px) scale(.6); } 25% { opacity: 1; } 75%,100% { opacity: 0; transform: translate(3px,-10px) scale(1); } }
    @media (prefers-reduced-motion: reduce) { .flame,.core,.glow,.ember { animation: none; } }
  </style>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="#111923" stroke="#243244" stroke-width="2"/>
  <circle class="glow" cx="32" cy="39" r="17" fill="#F0BD62" opacity=".22"/>
