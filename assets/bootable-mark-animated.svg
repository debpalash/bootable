    <path class="core" d="M32.5 46c2.6-.9 4.1-2.8 3.8-5.1-.2-1.8-1.4-3.3-3.4-5.3 0 2.3-1.2 3.2-2.1 4.2-.8-.8-1-1.6-.8-2.6-2 1.7-2.9 3.4-2.5 5.1.4 2.2 2.4 3.9 5 3.7Z" fill="#FFF0B8"/>
