name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'apps/**'
      - 'assets/**'
      - 'crates/**'
      - 'packaging/**'
      - 'scripts/package-*'
      - 'scripts/verify-*'
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux:
    name: Package Linux x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-unknown-linux-gnu
      - name: Read and validate package version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          echo "BOOTABLE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-x11-dev pkg-config rpm
      - name: Download pinned AppImage tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl -fsSLo "$RUNNER_TEMP/appimage-tools/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  '"$RUNNER_TEMP/appimage-tools/linuxdeploy" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/appimage-tools/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  '"$RUNNER_TEMP/appimage-tools/appimagetool" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/appimage-tools/linuxdeploy" "$RUNNER_TEMP/appimage-tools/appimagetool"
      - run: cargo test --workspace
      - run: cargo build --release --workspace --target x86_64-unknown-linux-gnu
      - name: Build DEB, RPM, AppImage, and archive
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LINUXDEPLOY: ${{ runner.temp }}/appimage-tools/linuxdeploy
          APPIMAGETOOL: ${{ runner.temp }}/appimage-tools/appimagetool
        run: scripts/package-linux.sh "$BOOTABLE_VERSION"
      - name: Verify Linux packages
        run: scripts/verify-linux-packages.sh "$BOOTABLE_VERSION"
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/linux/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/linux/*
          if-no-files-found: error

  macos:
    name: Package macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-apple-darwin
      - name: Read and validate package version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          echo "BOOTABLE_VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo test --workspace
      - run: cargo build --release --workspace --target aarch64-apple-darwin
      - name: Build DMG and archive
        run: scripts/package-macos.sh "$BOOTABLE_VERSION"
      - name: Verify macOS packages
        run: scripts/verify-macos-packages.sh "$BOOTABLE_VERSION"
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/macos/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-aarch64
          path: dist/macos/*
          if-no-files-found: error

  windows:
    name: Package Windows x86-64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc
      - name: Read and validate package version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          echo "BOOTABLE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install pinned cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo test --workspace
      - run: cargo build --release --workspace --target x86_64-pc-windows-msvc
      - name: Build MSI, NSIS installer, portable executables, and archive
        shell: pwsh
        run: scripts/package-windows.ps1 -Version $env:BOOTABLE_VERSION
      - name: Verify Windows packages
        shell: pwsh
        run: scripts/verify-windows-packages.ps1 -Version $env:BOOTABLE_VERSION
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/windows/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/windows/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          body: |
            ## Bootable ${{ github.ref_name }}

            Bootable ships native installers and portable builds for its matching GUI and TUI.
            Packages are unsigned and the macOS app is ad-hoc signed, not notarized. Use expendable
            USB or SD media and check the physical target before approving erasure.

            - Linux x86-64: AppImage, DEB, RPM, and tar.gz
            - Windows 10+ x86-64: MSI, setup EXE, portable GUI/TUI EXEs, and ZIP
            - macOS Apple Silicon: DMG and tar.gz
            - Integrity: SHA-256 sidecars and GitHub build provenance for every asset
            - Privilege: interactive apps remain unelevated; a fixed helper performs approved writes

            The DEB/RPM and Windows installers place the protected helper automatically. The macOS
            DMG includes an explicit helper installer. Legacy BIOS helpers, Linux persistence,
            Windows To Go, DOS media, and multiboot are not implemented.
          files: dist/*
