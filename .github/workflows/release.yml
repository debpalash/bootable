name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-x11-dev pkg-config
      - run: cargo test --workspace
      - run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package Unix artifacts
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="bootable-${version}-${{ matrix.target }}.tar.gz"
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/bootable" "$stage/"
          cp "target/${{ matrix.target }}/release/bootable-desktop" "$stage/"
          cp "target/${{ matrix.target }}/release/bootable-helper" "$stage/"
          cp assets/bootable-mark.svg "$stage/bootable.svg"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp packaging/app.bootable.Bootable.desktop "$stage/"
            cp packaging/app.bootable.write-media.policy "$stage/"
          fi
          cp scripts/install.sh "$stage/"
          cp README.md LICENSE "$stage/"
          tar -C "$stage" -czf "$asset" .
          sha256sum "$asset" > "${asset}.sha256" 2>/dev/null || shasum -a 256 "$asset" > "${asset}.sha256"
      - name: Verify Unix release archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="bootable-${version}-${{ matrix.target }}.tar.gz"
          verify="$(mktemp -d)"
          trap 'rm -rf "$verify"' EXIT
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${asset}.sha256"
          else
            shasum -a 256 -c "${asset}.sha256"
          fi
          tar -xzf "$asset" -C "$verify"
          for executable in bootable bootable-desktop bootable-helper install.sh; do
            test -x "$verify/$executable"
          done
          for file in README.md LICENSE bootable.svg; do
            test -f "$verify/$file"
          done
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -f "$verify/app.bootable.Bootable.desktop"
            test -f "$verify/app.bootable.write-media.policy"
          fi
          test "$("$verify/bootable" --version)" = "bootable $version"
          "$verify/bootable" --help >/dev/null
      - name: Package Windows artifacts
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $asset = "bootable-$version-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Path stage
          Copy-Item "target/${{ matrix.target }}/release/bootable.exe" stage/
          Copy-Item "target/${{ matrix.target }}/release/bootable-desktop.exe" stage/
          Copy-Item "target/${{ matrix.target }}/release/bootable-helper.exe" stage/
          Copy-Item scripts/install.ps1 stage/
          Copy-Item assets/bootable-mark.svg stage/bootable.svg
          Copy-Item README.md,LICENSE stage/
          Compress-Archive -Path stage/* -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - name: Verify Windows release archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $asset = "bootable-$version-${{ matrix.target }}.zip"
          $expectedHash = (Get-Content "$asset.sha256" -Raw).Split(' ')[0]
          $actualHash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) { throw 'Packaged ZIP checksum does not match its sidecar.' }
          $verify = Join-Path $env:RUNNER_TEMP 'bootable-release-verify'
          Expand-Archive -LiteralPath $asset -DestinationPath $verify
          $required = @(
            'bootable.exe',
            'bootable-desktop.exe',
            'bootable-helper.exe',
            'install.ps1',
            'bootable.svg',
            'README.md',
            'LICENSE'
          )
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $verify $name) -PathType Leaf)) {
              throw "Release ZIP is missing $name."
            }
          }
          $reportedVersion = & (Join-Path $verify 'bootable.exe') --version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion.Trim() -ne "bootable $version") {
            throw "Release binary reported unexpected version: $reportedVersion"
          }
          & (Join-Path $verify 'bootable.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged TUI failed its help smoke test.' }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: bootable-*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            bootable-*.tar.gz
            bootable-*.zip
            bootable-*.sha256
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            ## Bootable public alpha

            Executables are unsigned; the macOS build is not notarized. Use expendable USB or SD
            media. Check the physical target before approving erasure.

            - Packages: Linux x86-64, Windows 10+ x86-64, macOS Apple Silicon
            - Interfaces: native desktop, mouse-enabled TUI, CLI
            - Raw media: ISO, IMG, RAW, XZ, gzip, Zstandard, bzip2
            - Windows media: GPT or MBR, FAT32, split WIM, boot-tree audit
            - Integrity: publisher checksum when available; raw byte read-back after writing
            - Privilege: interactive apps remain unelevated; a fixed helper performs approved writes

            Each archive has a SHA-256 sidecar and GitHub build provenance. Legacy BIOS helpers,
            Linux persistence, Windows To Go, DOS media, and multiboot are not implemented.
          files: dist/*
