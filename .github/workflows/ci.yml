name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-x11-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  platform-build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-14
          - name: Windows x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-x11-dev pkg-config
      - run: cargo build --release --workspace

  qemu-uefi-smoke:
    name: Read-only UEFI smoke assertion
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU/OVMF fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf socat grub-pc-bin grub-efi-amd64-bin xorriso mtools ffmpeg
      - name: Build deterministic UEFI fixture
        run: scripts/qemu-uefi-fixture.sh /tmp/bootable-uefi-fixture.iso
      - name: Assert the booted frame
        env:
          BOOTABLE_QEMU_WAIT_SECONDS: 10
          BOOTABLE_QEMU_COLOR_TOLERANCE: 64
        run: scripts/qemu-uefi-smoke.sh --cdrom /tmp/bootable-uefi-fixture.iso /tmp/bootable-uefi-fixture.png 0000aa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-uefi-smoke-frame
          path: /tmp/bootable-uefi-fixture.png
          if-no-files-found: warn
