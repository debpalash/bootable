name: Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'scripts/install.sh'
      - 'assets/bootable-logo.svg'
      - 'assets/bootable-logo-animated.svg'
      - 'assets/bootable-mark.svg'
      - 'docs/screenshots/gui-discover.png'
      - 'docs/screenshots/gui-demo.gif'
      - 'docs/screenshots/gui-toolbar.png'
      - 'docs/screenshots/tui-main.png'
      - 'docs/screenshots/tui-demo.gif'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix site
          npm run build --prefix site
          dist=site/dist
          canonical_file="$(mktemp)"
          page_count=0
          for page in "$dist"/*.html; do
            if [ "${page##*/}" = "404.html" ]; then
              continue
            fi
            page_count=$((page_count + 1))
            canonical="$(sed -n 's/.*<link rel="canonical" href="\([^"]*\)".*/\1/p' "$page")"
            test -n "$canonical"
            printf '%s\n' "$canonical" >> "$canonical_file"
            grep -Fq "<loc>${canonical}</loc>" "$dist/sitemap.xml"
            if grep -Fq 'name="robots" content="noindex"' "$page"; then
              echo "Indexable page is marked noindex: $page" >&2
              exit 1
            fi
          done
          test "$(sort -u "$canonical_file" | wc -l)" -eq "$page_count"
          test "$(grep -c '<loc>' "$dist/sitemap.xml")" -eq "$page_count"
          version="$(sed -n 's/^VERSION="${BOOTABLE_VERSION:-\([^"]*\)}"/\1/p' scripts/install.sh)"
          test -n "$version"
          grep -Fq "v${version}" "$dist/index.html"
          grep -Fq "v${version}" "$dist/download.html"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
