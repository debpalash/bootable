name: Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'scripts/install.sh'
      - 'assets/bootable-logo.svg'
      - 'assets/bootable-logo-animated.svg'
      - 'assets/bootable-mark.svg'
      - 'docs/screenshots/gui-discover.png'
      - 'docs/screenshots/gui-demo.gif'
      - 'docs/screenshots/gui-toolbar.png'
      - 'docs/screenshots/tui-main.png'
      - 'docs/screenshots/tui-demo.gif'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          canonical_file="$(mktemp)"
          page_count=0
          for page in site/*.html; do
            if [ "${page##*/}" = "404.html" ]; then
              continue
            fi
            page_count=$((page_count + 1))
            canonical="$(sed -n 's/.*<link rel="canonical" href="\([^"]*\)".*/\1/p' "$page")"
            test -n "$canonical"
            printf '%s\n' "$canonical" >> "$canonical_file"
            grep -Fq "<loc>${canonical}</loc>" site/sitemap.xml
            if grep -Fq 'name="robots" content="noindex"' "$page"; then
              echo "Indexable page is marked noindex: $page" >&2
              exit 1
            fi
          done
          test "$(sort -u "$canonical_file" | wc -l)" -eq "$page_count"
          test "$(grep -c '<loc>' site/sitemap.xml)" -eq "$page_count"
          version="$(sed -n 's/^VERSION="${BOOTABLE_VERSION:-\([^"]*\)}"/\1/p' scripts/install.sh)"
          test -n "$version"
          grep -Fq "v${version}" site/index.html
          grep -Fq "v${version}" site/download.html
          mkdir _site
          cp site/*.html site/*.css site/robots.txt site/sitemap.xml _site/
          cp site/social-card.png _site/social-card.png
          cp scripts/install.sh _site/install.sh
          cp assets/bootable-logo.svg _site/bootable-logo.svg
          cp assets/bootable-logo-animated.svg _site/bootable-logo-animated.svg
          cp assets/bootable-mark.svg _site/favicon.svg
          cp docs/screenshots/gui-discover.png _site/gui-discover.png
          cp docs/screenshots/gui-demo.gif _site/gui-demo.gif
          cp docs/screenshots/gui-toolbar.png _site/gui-toolbar.png
          cp docs/screenshots/tui-main.png _site/tui-main.png
          cp docs/screenshots/tui-demo.gif _site/tui-demo.gif
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
